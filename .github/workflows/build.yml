# MakerCAD's cloud build (decision D28). The reference PC (8 GB, a spinning disk) needs hours to
# compile SolidCraft's crates; a GitHub runner (16 GB, SSD) does it in about an hour, and
# caches it for the next push.
#
# Every push to main: the gates (fmt, brand-free, clippy, tests) and, side by side, an optimised
# makercad.exe for Windows x64, published as a test build on the Releases page so anyone can
# download it without a GitHub account. Pull requests and manual runs build but do not publish.
#
# SolidCraft is fetched at the pinned rev (third_party/SOLIDCRAFT_REV), never committed here.
# Action versions are pinned by commit, as SolidCraft pins them.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: Gates (fmt, brand-free, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SolidCraft at the pinned rev
        shell: pwsh
        run: ./tools/fetch_solidcraft.ps1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gates
          workspaces: ". -> third_party/solidcraft/target"
      - name: Format
        # Our crates only: `--all` would also check SolidCraft's path crates.
        run: cargo fmt -p mk-units -p mk-nest -p mk-inventory -p mk-sancho -p mk-desktop --check
      - name: Brand-free (AGENTS.md rule 3)
        shell: pwsh
        run: ./tools/brand_free.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  windows:
    name: makercad.exe (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 240
    permissions:
      contents: write # publishes the test build on the Releases page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SolidCraft at the pinned rev
        shell: pwsh
        run: ./tools/fetch_solidcraft.ps1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x64
          workspaces: ". -> third_party/solidcraft/target"
      - name: Build (release, C runtime linked in)
        # The flag only for the explicit target, so build scripts and proc macros stay as they
        # are (SolidCraft's packaging does the same): the exe needs nothing else installed.
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p mk-desktop --bin makercad --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: ./tools/package_windows.ps1 -Build "${{ github.run_number }}" -Commit "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: makercad-windows-x64
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish the test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-${{ github.run_number }}"
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          $sum = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $short = "${{ github.sha }}".Substring(0, 7)
          $notes = @"
          A test build of MakerCAD for Windows x64, made by the cloud build from commit $short. Not a release: expect rough edges.

          Download the zip, unzip it anywhere and run ``makercad.exe``. Windows may say it "protected your PC" because the program is not signed yet: choose **More info**, then **Run anyway**. READ-ME-FIRST.txt in the zip says what to try.

          SHA-256 of the zip: ``$sum``
          "@
          gh release create $tag $zip.FullName --prerelease --target "${{ github.sha }}" --title "Test build ${{ github.run_number }} ($short)" --notes $notes
